<!DOCTYPE html>
<html>
<head>
    <title>Secure Chat</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            /* 🎨 خلفية متحركة */
            background: linear-gradient(-45deg, #075e54, #128c7e, #25d366, #0a8f6a);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove{
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }

        .chat-container{
            width: 420px;
            height: 90vh;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            animation: pop 0.5s ease;
        }

        @keyframes pop{
            from{transform:scale(0.9); opacity:0;}
            to{transform:scale(1); opacity:1;}
        }

        .header{
            background:#075e54;
            color:white;
            padding:15px;
            text-align:center;
            font-weight:bold;
            letter-spacing:1px;
        }

        form{
            display:flex;
            flex-direction:column;
            padding:10px;
            background:white;
            gap:6px;
        }

        input{
            padding:10px;
            border-radius:10px;
            border:1px solid #ccc;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border-color:#25d366;
            box-shadow:0 0 5px #25d366;
        }

        button{
            padding:10px;
            border:none;
            border-radius:10px;
            background:#25d366;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1ebe5d;
            transform:scale(1.02);
        }

        #messages{
            flex:1;
            overflow-y:auto;
            padding:10px;
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .msg{
            max-width:75%;
            padding:10px;
            border-radius:15px;
            font-size:14px;
            word-wrap:break-word;

            /* ✨ تأثير دخول */
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn{
            from{opacity:0; transform:translateY(10px);}
            to{opacity:1; transform:translateY(0);}
        }

        .me{
            align-self:flex-end;
            background: linear-gradient(135deg, #dcf8c6, #b7f5b1);
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        .other{
            align-self:flex-start;
            background:white;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        .sender{
            font-size:11px;
            font-weight:bold;
            color:#555;
            margin-bottom:3px;
        }

    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">💬 Secure Chat</div>

    <form method="POST">
        <input name="username" placeholder="Your Name">
        <input name="receiver" placeholder="Receiver">
        <input name="message" placeholder="Message">
        <button type="submit">Send</button>
    </form>

    <div id="messages"></div>

</div>

<script>

let username = prompt("Enter your username:");

async function loadMessages(){

    if(!username) return;

    let res = await fetch("/messages/" + username);
    let data = await res.json();

    let box = document.getElementById("messages");
    box.innerHTML = "";

    data.forEach(m => {

        let div = document.createElement("div");

        div.className = "msg " + (m.sender === username ? "me" : "other");

        div.innerHTML =
            "<div class='sender'>" + m.sender + "</div>" +
            "<div>" + m.message + "</div>";

        box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
}

setInterval(loadMessages, 2000);

</script>

</body>
</html>
